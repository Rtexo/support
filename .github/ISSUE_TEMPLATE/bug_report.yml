name: Bug report
description: Report a reproducible problem with a Rtexo product
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first. This form is public. Never include credentials, tokens, auth URLs, private keys, customer data, or unredacted logs. Read the safe-reporting guidance at https://rtexo.com/ before posting.
  - type: dropdown
    id: product
    attributes:
      label: Product
      description: Select the product. Do not include connection details.
      options:
        - SOQL Data Source for Salesforce
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: For example, 1.2.3
    validations:
      required: true
  - type: input
    id: ide-version
    attributes:
      label: IDE and version
      placeholder: For example, DataGrip 2026.2
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: For example, Windows 11, macOS, or Ubuntu
    validations:
      required: true
  - type: input
    id: sf-cli-version
    attributes:
      label: Salesforce CLI version
      description: Run sf version. Do not paste sf org display, authentication output, or JSON containing org data.
    validations:
      required: false
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and include a short, redacted query only if needed.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Configure ...
        2. Open ...
        3. Run ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant redacted logs
      description: Remove tokens, usernames, org identifiers, record data, and other private details before sharing.
    validations:
      required: false
  - type: dropdown
    id: connection-context
    attributes:
      label: Connection context
      description: Do not include an alias, username, instance URL, or organization ID.
      options:
        - Sandbox
        - Production
        - Scratch Org
        - Developer Edition
        - Prefer not to say
    validations:
      required: false
  - type: checkboxes
    id: safe-report
    attributes:
      label: Safe public report confirmation
      options:
        - label: I confirm this public report contains no access token, refresh token, session ID, password, auth URL, private key, organization identifier, real customer data, or unredacted log.
          required: true
